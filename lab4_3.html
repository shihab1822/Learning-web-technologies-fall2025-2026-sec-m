<html lang="en">
<head>
    <title>Gender Form</title>

    <script>
        function testRadioButton() {

            let gError = document.getElementById("gError");
            let gender = document.querySelector('input[name="gender"]:checked');

            if (!gender) {
                gError.innerHTML = "One of them must be selected!";
                gError.style.color = "red";
                return false;
            }

            gError.innerHTML = "";
            return true;
        }
    </script>

</head>
<body>

    <p>Gender</p>

    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="others"> Others

    <br><br>

    <input type="button" value="Submit" onclick="testRadioButton()">
    <p id="gError"></p>

</body>
</html>
